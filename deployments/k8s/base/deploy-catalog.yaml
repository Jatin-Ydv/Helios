apiVersion: apps/v1
kind: Deployment
metadata:
  name: catalog
  labels: { app: catalog, app.kubernetes.io/part-of: helios }
spec:
  replicas: 2
  selector: { matchLabels: { app: catalog } }
  template:
    metadata:
      labels: { app: catalog, app.kubernetes.io/part-of: helios }
      annotations: { prometheus.io/scrape: "true", prometheus.io/port: "8080" }
    spec:
      terminationGracePeriodSeconds: 25
      containers:
        - name: catalog
          image: helios/catalog:local
          ports: [{ containerPort: 8080, name: http }]
          envFrom: [{ configMapRef: { name: helios-config } }]
          env:
            - name: POSTGRES_DSN
              valueFrom: { secretKeyRef: { name: helios-pg, key: catalog } }
            - name: JWT_SECRET
              valueFrom: { secretKeyRef: { name: helios-jwt, key: secret } }
          readinessProbe: { httpGet: { path: /readyz, port: http } }
          resources:
            requests: { cpu: 50m, memory: 64Mi }
            limits: { cpu: 500m, memory: 256Mi }
---
apiVersion: v1
kind: Service
metadata: { name: catalog }
spec:
  selector: { app: catalog }
  ports: [{ port: 8080, targetPort: http }]
