apiVersion: apps/v1
kind: Deployment
metadata:
  name: gateway
  labels: { app: gateway, app.kubernetes.io/part-of: helios }
spec:
  replicas: 2
  selector:
    matchLabels: { app: gateway }
  template:
    metadata:
      labels: { app: gateway, app.kubernetes.io/part-of: helios }
      annotations:
        prometheus.io/scrape: "true"
        prometheus.io/port: "8080"
        prometheus.io/path: /metrics
    spec:
      terminationGracePeriodSeconds: 25
      topologySpreadConstraints:
        - maxSkew: 1
          topologyKey: topology.kubernetes.io/zone
          whenUnsatisfiable: ScheduleAnyway
          labelSelector:
            matchLabels: { app: gateway }
      containers:
        - name: gateway
          image: helios/gateway:local
          ports: [{ containerPort: 8080, name: http }]
          envFrom: [{ configMapRef: { name: helios-config } }]
          env:
            - name: IDENTITY_URL
              value: http://identity:8080
            - name: CATALOG_URL
              value: http://catalog:8080
            - name: SEARCH_URL
              value: http://search:8080
            - name: INVENTORY_URL
              value: http://inventory:8080
            - name: ORDER_URL
              value: http://order:8080
            - name: PAYMENT_URL
              value: http://payment:8080
            - name: FULFILLMENT_URL
              value: http://fulfillment:8080
            - name: ORCHESTRATOR_URL
              value: http://orchestrator:8080
            - name: NOTIFICATION_URL
              value: http://notification:8080
            - name: JWT_SECRET
              valueFrom:
                secretKeyRef: { name: helios-jwt, key: secret }
          readinessProbe: { httpGet: { path: /readyz, port: http }, periodSeconds: 5 }
          livenessProbe: { httpGet: { path: /healthz, port: http }, periodSeconds: 10 }
          resources:
            requests: { cpu: 100m, memory: 64Mi }
            limits: { cpu: "1", memory: 256Mi }
          securityContext:
            readOnlyRootFilesystem: true
            allowPrivilegeEscalation: false
            runAsNonRoot: true
---
apiVersion: v1
kind: Service
metadata:
  name: gateway
spec:
  selector: { app: gateway }
  ports: [{ port: 8080, targetPort: http }]
