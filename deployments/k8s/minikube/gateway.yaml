apiVersion: apps/v1
kind: Deployment
metadata:
  name: gateway
  labels: { app: gateway }
spec:
  replicas: 1
  selector: { matchLabels: { app: gateway } }
  template:
    metadata:
      labels: { app: gateway, app.kubernetes.io/part-of: helios }
    spec:
      initContainers:
        - name: wait
          image: busybox:1.36
          command: ["sh", "-c", "until nc -z redis 6379 && nc -z identity 8080 && nc -z orchestrator 8080; do sleep 2; done"]
      containers:
        - name: gateway
          image: helios/gateway:minikube
          imagePullPolicy: IfNotPresent
          ports: [{ containerPort: 8080, name: http }]
          envFrom: [{ configMapRef: { name: helios-config } }]
          env:
            - name: JWT_SECRET
              valueFrom: { secretKeyRef: { name: helios-secrets, key: JWT_SECRET } }
          readinessProbe: { httpGet: { path: /readyz, port: http }, periodSeconds: 5 }
          livenessProbe: { httpGet: { path: /healthz, port: http }, periodSeconds: 15 }
          resources:
            requests: { cpu: 25m, memory: 48Mi }
            limits: { memory: 128Mi }
---
apiVersion: v1
kind: Service
metadata: { name: gateway }
spec:
  type: NodePort
  selector: { app: gateway }
  ports:
    - { name: http, port: 8080, targetPort: http, nodePort: 30080 }
