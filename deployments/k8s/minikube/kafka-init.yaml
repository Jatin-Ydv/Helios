apiVersion: batch/v1
kind: Job
metadata:
  name: kafka-init
spec:
  backoffLimit: 20
  ttlSecondsAfterFinished: 300
  template:
    spec:
      restartPolicy: OnFailure
      containers:
        - name: init
          image: apache/kafka:3.8.1
          env:
            - { name: KAFKA_BROKER, value: "kafka:9092" }
          command: ["/bin/bash", "/scripts/kafka-init.sh"]
          volumeMounts:
            - { name: scripts, mountPath: /scripts }
          resources:
            requests: { cpu: 25m, memory: 64Mi }
            limits: { memory: 192Mi }
      volumes:
        - name: scripts
          configMap: { name: kafka-init-script, defaultMode: 0755 }
