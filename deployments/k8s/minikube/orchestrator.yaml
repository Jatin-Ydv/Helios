apiVersion: apps/v1
kind: Deployment
metadata:
  name: orchestrator
  labels: { app: orchestrator }
spec:
  replicas: 1
  selector: { matchLabels: { app: orchestrator } }
  template:
    metadata:
      labels: { app: orchestrator, app.kubernetes.io/part-of: helios }
    spec:
      initContainers:
        - name: wait
          image: busybox:1.36
          command: ["sh", "-c", "until nc -z postgres 5432 && nc -z kafka 9092 && nc -z order 9090 && nc -z inventory 9090 && nc -z payment 9090 && nc -z fulfillment 9090; do sleep 2; done"]
      containers:
        - name: orchestrator
          image: helios/orchestrator:minikube
          imagePullPolicy: IfNotPresent
          ports: [{ containerPort: 8080, name: http }]
          envFrom: [{ configMapRef: { name: helios-config } }]
          env:
            - name: POSTGRES_DSN
              valueFrom: { secretKeyRef: { name: helios-secrets, key: POSTGRES_DSN_ORCHESTRATOR } }
            - name: JWT_SECRET
              valueFrom: { secretKeyRef: { name: helios-secrets, key: JWT_SECRET } }
          readinessProbe: { httpGet: { path: /readyz, port: http }, periodSeconds: 5 }
          resources:
            requests: { cpu: 25m, memory: 48Mi }
            limits: { memory: 128Mi }
---
apiVersion: v1
kind: Service
metadata: { name: orchestrator }
spec:
  selector: { app: orchestrator }
  ports: [{ port: 8080, targetPort: http }]
