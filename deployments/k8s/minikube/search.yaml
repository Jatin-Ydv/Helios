apiVersion: apps/v1
kind: Deployment
metadata:
  name: search
  labels: { app: search }
spec:
  replicas: 1
  selector: { matchLabels: { app: search } }
  template:
    metadata:
      labels: { app: search, app.kubernetes.io/part-of: helios }
    spec:
      initContainers:
        - name: wait
          image: busybox:1.36
          command: ["sh", "-c", "until nc -z kafka 9092 && nc -z elasticsearch 9200; do sleep 2; done"]
      containers:
        - name: search
          image: helios/search:minikube
          imagePullPolicy: IfNotPresent
          ports: [{ containerPort: 8080, name: http }]
          envFrom: [{ configMapRef: { name: helios-config } }]
          env:
            - name: JWT_SECRET
              valueFrom: { secretKeyRef: { name: helios-secrets, key: JWT_SECRET } }
          readinessProbe: { httpGet: { path: /readyz, port: http }, periodSeconds: 5 }
          resources:
            requests: { cpu: 25m, memory: 64Mi }
            limits: { memory: 160Mi }
---
apiVersion: v1
kind: Service
metadata: { name: search }
spec:
  selector: { app: search }
  ports: [{ port: 8080, targetPort: http }]
