# Aerospike CE for Docker Compose. Namespace `helios` is defined here.
service {
  cluster-name helios
  proto-fd-max 15000
}

logging {
  console {
    context any info
  }
}

network {
  service {
    address any
    port 3000
  }
  heartbeat {
    mode mesh
    address any
    port 3002
    interval 150
    timeout 10
  }
  fabric {
    port 3001
  }
  info {
    port 3003
  }
}

namespace helios {
  replication-factor 1
  storage-engine memory {
    data-size 256M
  }
  default-ttl 0
  nsup-period 120
}
