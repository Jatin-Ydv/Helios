{{- if .Values.postgres.enabled }}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: postgres
  namespace: {{ .Values.namespace }}
  labels:
    app: postgres
    {{- include "helios.labels" . | nindent 4 }}
spec:
  replicas: 1
  selector:
    matchLabels:
      app: postgres
  template:
    metadata:
      labels:
        app: postgres
    spec:
      containers:
        - name: postgres
          image: {{ .Values.postgres.image }}
          args: ["postgres", "-c", "wal_level=logical", "-c", "max_connections=120"]
          env:
            - name: POSTGRES_USER
              value: {{ .Values.secrets.postgresUser | quote }}
            - name: POSTGRES_PASSWORD
              value: {{ .Values.secrets.postgresPassword | quote }}
            - name: POSTGRES_DB
              value: helios
            - name: PGDATA
              value: /var/lib/postgresql/data/pgdata
          ports:
            - { containerPort: 5432, name: pg }
          readinessProbe:
            exec:
              command: ["pg_isready", "-U", {{ .Values.secrets.postgresUser | quote }}]
            periodSeconds: 5
            timeoutSeconds: 3
          resources:
            {{- toYaml .Values.postgres.resources | nindent 12 }}
          volumeMounts:
            - { name: data, mountPath: /var/lib/postgresql/data }
            - { name: init, mountPath: /docker-entrypoint-initdb.d }
      volumes:
        - { name: data, emptyDir: {} }
        - name: init
          configMap:
            name: postgres-init
            defaultMode: 0755
---
apiVersion: v1
kind: Service
metadata:
  name: postgres
  namespace: {{ .Values.namespace }}
  labels:
    app: postgres
    {{- include "helios.labels" . | nindent 4 }}
spec:
  selector:
    app: postgres
  ports:
    - { port: 5432, targetPort: pg }
{{- end }}
