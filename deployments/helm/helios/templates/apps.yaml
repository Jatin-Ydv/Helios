{{- range $name, $app := .Values.apps }}
{{- $grpc := dig "grpc" $.Values.appDefaults.grpc $app }}
{{- $resources := dig "resources" $.Values.appDefaults.resources $app }}
{{- $replicas := dig "replicas" $.Values.appDefaults.replicas $app }}
{{- $image := printf "helios/%s:%s" $name $.Values.imageTag }}
{{- if $.Values.imageRegistry }}
{{- $image = printf "%s/helios/%s:%s" $.Values.imageRegistry $name $.Values.imageTag }}
{{- end }}
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ $name }}
  namespace: {{ $.Values.namespace }}
  labels:
    app: {{ $name }}
    {{- include "helios.labels" $ | nindent 4 }}
spec:
  replicas: {{ $replicas }}
  selector:
    matchLabels:
      app: {{ $name }}
  template:
    metadata:
      labels:
        app: {{ $name }}
        app.kubernetes.io/part-of: helios
    spec:
      {{- if $app.wait }}
      initContainers:
        - name: wait
          image: {{ $.Values.busybox.image }}
          command: ["sh", "-c", {{ $app.wait | quote }}]
      {{- end }}
      containers:
        - name: {{ $name }}
          image: {{ $image }}
          imagePullPolicy: {{ $.Values.imagePullPolicy }}
          ports:
            - { containerPort: 8080, name: http }
            {{- if $grpc }}
            - { containerPort: 9090, name: grpc }
            {{- end }}
          envFrom:
            - configMapRef:
                name: helios-config
          env:
            - name: JWT_SECRET
              valueFrom:
                secretKeyRef:
                  name: helios-secrets
                  key: JWT_SECRET
            {{- if $app.postgresSecretKey }}
            - name: POSTGRES_DSN
              valueFrom:
                secretKeyRef:
                  name: helios-secrets
                  key: {{ $app.postgresSecretKey }}
            {{- end }}
            {{- range $ek, $ev := dig "env" dict $app }}
            - name: {{ $ek }}
              value: {{ $ev | quote }}
            {{- end }}
          readinessProbe:
            httpGet: { path: /readyz, port: http }
            periodSeconds: 5
          {{- if $app.liveness }}
          livenessProbe:
            httpGet: { path: /healthz, port: http }
            periodSeconds: 15
          {{- end }}
          resources:
            {{- toYaml $resources | nindent 12 }}
---
apiVersion: v1
kind: Service
metadata:
  name: {{ $name }}
  namespace: {{ $.Values.namespace }}
  labels:
    app: {{ $name }}
    {{- include "helios.labels" $ | nindent 4 }}
spec:
  {{- if eq $name "gateway" }}
  type: {{ dig "serviceType" "NodePort" $app }}
  {{- end }}
  selector:
    app: {{ $name }}
  ports:
    - name: http
      port: 8080
      targetPort: http
      {{- if and (eq $name "gateway") (dig "nodePort" 0 $app) }}
      nodePort: {{ dig "nodePort" $.Values.gateway.nodePort $app }}
      {{- end }}
    {{- if $grpc }}
    - name: grpc
      port: 9090
      targetPort: grpc
    {{- end }}
{{- end }}
