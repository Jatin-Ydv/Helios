global:
  scrape_interval: 10s
  evaluation_interval: 10s

alerting:
  alertmanagers: []

rule_files:
  - /etc/prometheus/alerts.yml

scrape_configs:
  - job_name: helios
    metrics_path: /metrics
    static_configs:
      - targets:
          - gateway:8080
          - identity:8080
          - catalog:8080
          - inventory:8080
          - order:8080
          - payment:8080
          - fulfillment:8080
          - orchestrator:8080
          - search:8080
          - notification:8080
